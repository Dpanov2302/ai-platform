services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - models-onnx
      - model-text2text
    environment:
      - ALLOWED_ORIGINS=http://localhost

  models-onnx:
    build: ./models/models-onnx
    ports:
      - "8504:8504"
    environment:
      - ALLOWED_ORIGINS=http://localhost

  model-text2text:
    build: ./models/model-text2text
    ports:
      - "8503:8503"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - ALLOWED_ORIGINS=http://localhost

  frontend:
    build:
      context: ./frontend
    volumes:
      - frontend_build:/app/dist
    command: npm run build

  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - frontend_build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  frontend_build:
  huggingface_cache:
